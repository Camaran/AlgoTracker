services:

  # ────────────────────────────────────────────
  # 1. BASE DE DATOS — PostgreSQL
  # ────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: algotracker_db
    restart: unless-stopped
    environment:
      POSTGRES_DB:       algotracker_db
      POSTGRES_USER:     algotracker_user
      POSTGRES_PASSWORD: Aa1073162355
    volumes:
      # Los datos de PostgreSQL persisten aquí aunque hagas "docker compose down"
      - postgres_data:/var/lib/postgresql/data
      # Ejecuta la migración automáticamente la primera vez
      - ./Postgres_db_migrations/migrations_completo.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U algotracker_user -d algotracker_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ────────────────────────────────────────────
  # 2. BACKEND — FastAPI
  # ────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: algotracker_backend
    restart: unless-stopped
    environment:
      DB_HOST:     db
      DB_PORT:     5432
      DB_NAME:     algotracker_db
      DB_USER:     algotracker_user
      DB_PASSWORD: Aa1073162355
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy   # Espera a que PostgreSQL esté listo
    volumes:
      # Hot-reload: cambios en el código se reflejan sin rebuild
      - ./main.py:/app/main.py
      - ./metrics:/app/metrics

  # ────────────────────────────────────────────
  # 3. FRONTEND — React
  # ────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: ../Dockerfile.frontend
    container_name: algotracker_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - backend
    volumes:
      # Hot-reload del frontend
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public

# ────────────────────────────────────────────
# VOLUMEN persistente para la BD
# ────────────────────────────────────────────
volumes:
  postgres_data:
